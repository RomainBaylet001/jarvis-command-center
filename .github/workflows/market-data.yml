name: NORTHSTAR - Hourly ETF Prices

on:
  workflow_dispatch:
  schedule:
    # UTC: covers German summer and winter trading hours.
    - cron: '17 7-17 * * 1-5'

    # Later check for completed daily closing prices.
    - cron: '47 19 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install data and calendar readers
        run: >-
          python -m pip install
          'yfinance>=0.2.60,<2'
          'exchange-calendars>=4.11,<5'

      - name: Retrieve quotes and completed daily history
        id: market
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          import os
          import time

          from datetime import (
              datetime,
              timedelta,
              timezone,
          )
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import exchange_calendars as xcals
          import pandas as pd
          import yfinance as yf

          now = datetime.now(timezone.utc)

          local = now.astimezone(
              ZoneInfo('Europe/Berlin')
          )

          today = local.date()

          calendar = xcals.get_calendar(
              'XETR',
              start=str(
                  today - timedelta(days=1200)
              ),
              end=str(
                  today + timedelta(days=90)
              ),
          )

          label = pd.Timestamp(today)
          trading_day = calendar.is_session(label)

          opening = (
              calendar.session_open(label)
              if trading_day else None
          )

          closing = (
              calendar.session_close(label)
              if trading_day else None
          )

          scheduled = (
              os.environ.get('GITHUB_EVENT_NAME')
              == 'schedule'
          )

          evening = local.hour >= 20

          in_window = (
              trading_day and
              opening <= now <= (
                  closing + timedelta(minutes=90)
              )
          )

          if scheduled and (
              not trading_day or
              (not in_window and not evening)
          ):
              print(
                  'Outside Xetra update window; '
                  'nothing to publish.'
              )

              with open(
                  os.environ['GITHUB_OUTPUT'],
                  'a'
              ) as output:
                  output.write('publish=false\n')

              raise SystemExit(0)

          path = Path(
              'public/data/etf-history.json'
          )

          previous = (
              json.loads(path.read_text())
              if path.exists() else {}
          )

          symbols = {
              'VWCE': 'VWCE.DE',
              'VFEA': 'VFEA.DE',
              'SXR8': 'SXR8.DE',
          }

          prices = {}
          quotes = {}
          warnings = []

          def retry(operation):
              for attempt in range(3):
                  try:
                      return operation()
                  except Exception:
                      if attempt == 2:
                          raise

                      time.sleep(
                          3 * (attempt + 1)
                      )

          def valid_price(value):
              return (
                  isinstance(value, (int, float)) and
                  math.isfinite(value) and
                  value > 0
              )

          for asset, symbol in symbols.items():
              ticker = yf.Ticker(symbol)
              rows = {}

              for day, price in previous.get(
                  'prices', {}
              ).get(asset, []):
                  if valid_price(price):
                      rows[day] = price

              try:
                  history = retry(
                      lambda: ticker.history(
                          period='2y',
                          interval='1d',
                          auto_adjust=False,
                          actions=False,
                          raise_errors=True,
                          timeout=25,
                      )
                  )

                  if history.empty:
                      raise ValueError(
                          'Empty history'
                      )

                  for stamp, close in (
                      history['Close'].items()
                  ):
                      day = stamp.date()
                      value = float(close)

                      if (
                          not valid_price(value) or
                          day > today
                      ):
                          continue

                      if day == today and (
                          not trading_day or
                          now < closing + timedelta(
                              minutes=30
                          )
                      ):
                          continue

                      rows[str(day)] = round(
                          value, 6
                      )

              except Exception as error:
                  warnings.append(
                      f'{asset} history retained: '
                      f'{type(error).__name__}'
                  )

              # Keep unfinished intraday prices out
              # of completed daily closing history.
              if (
                  not trading_day or
                  now < closing + timedelta(
                      minutes=30
                  )
              ):
                  rows.pop(str(today), None)

              if len(rows) < 60:
                  raise RuntimeError(
                      f'{asset}: insufficient '
                      'daily history'
                  )

              prices[asset] = sorted(
                  rows.items()
              )

              latest_day, latest_price = (
                  prices[asset][-1]
              )

              latest_label = pd.Timestamp(
                  latest_day
              )

              if calendar.is_session(
                  latest_label
              ):
                  quotes[asset] = {
                      'price': latest_price,
                      'asOf': (
                          calendar.session_close(
                              latest_label
                          ).isoformat()
                      ),
                      'date': latest_day,
                      'type': 'closing',
                  }

              retained = previous.get(
                  'quotes', {}
              ).get(asset)

              if (
                  isinstance(retained, dict) and
                  valid_price(
                      retained.get('price')
                  )
              ):
                  try:
                      stamp = pd.Timestamp(
                          retained['asOf']
                      )

                      baseline = quotes.get(
                          asset, {}
                      ).get('asOf')

                      if (
                          stamp.tzinfo and
                          stamp <= now and
                          (
                              not baseline or
                              stamp > pd.Timestamp(
                                  baseline
                              )
                          )
                      ):
                          quotes[asset] = retained

                  except (
                      KeyError,
                      ValueError,
                      TypeError,
                  ):
                      pass

              try:
                  info = retry(ticker.get_info)

                  value = info.get(
                      'regularMarketPrice'
                  )

                  stamp = info.get(
                      'regularMarketTime'
                  )

                  if (
                      info.get('currency') != 'EUR' or
                      info.get('symbol') != symbol
                  ):
                      raise ValueError(
                          'Unexpected quote '
                          'currency or symbol'
                      )

                  if (
                      not valid_price(value) or
                      not isinstance(
                          stamp, (int, float)
                      )
                  ):
                      raise ValueError(
                          'Quote price or '
                          'timestamp missing'
                      )

                  as_of = datetime.fromtimestamp(
                      stamp,
                      timezone.utc,
                  )

                  if as_of > now + timedelta(
                      minutes=5
                  ):
                      raise ValueError(
                          'Quote timestamp '
                          'is in the future'
                      )

                  baseline = quotes.get(
                      asset, {}
                  ).get('asOf')

                  if (
                      not baseline or
                      as_of > pd.Timestamp(
                          baseline
                      )
                  ):
                      quotes[asset] = {
                          'price': round(
                              value, 6
                          ),
                          'asOf': as_of.isoformat(
                              timespec='seconds'
                          ),
                          'date': (
                              as_of.astimezone(
                                  ZoneInfo(
                                      'Europe/Berlin'
                                  )
                              ).date().isoformat()
                          ),
                          'type': 'delayed',
                      }

              except Exception as error:
                  warnings.append(
                      f'{asset} quote retained: '
                      f'{type(error).__name__}'
                  )

              print(
                  f'{asset}: '
                  f'close {prices[asset][-1]}; '
                  f'quote {quotes.get(asset)}'
              )

          first = today - timedelta(days=7)
          last = today + timedelta(days=60)

          sessions = []

          for session in (
              calendar.sessions_in_range(
                  str(first),
                  str(last),
              )
          ):
              sessions.append({
                  'date': (
                      session.date().isoformat()
                  ),
                  'open': (
                      calendar.session_open(
                          session
                      ).isoformat()
                  ),
                  'close': (
                      calendar.session_close(
                          session
                      ).isoformat()
                  ),
              })

          payload = {
              'source': (
                  'Yahoo Finance via yfinance; '
                  'delayed EUR quotes and '
                  'completed daily history'
              ),
              'currency': 'EUR',
              'updatedAt': now.isoformat(
                  timespec='seconds'
              ),
              'latestDates': {
                  asset: rows[-1][0]
                  for asset, rows in prices.items()
              },
              'symbols': symbols,
              'prices': prices,
              'quotes': quotes,
              'market': {
                  'exchange': 'Xetra',
                  'session': 'Regular session',
                  'timezone': 'Europe/Berlin',
                  'calendarStart': (
                      first.isoformat()
                  ),
                  'calendarEnd': (
                      last.isoformat()
                  ),
                  'sessions': sessions,
              },
              'warnings': warnings,
          }

          path.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          path.write_text(
              json.dumps(
                  payload,
                  indent=2,
                  allow_nan=False,
              ) + '\n'
          )

          for warning in warnings:
              print(
                  '::warning::' + warning
              )

          with open(
              os.environ['GITHUB_OUTPUT'],
              'a',
          ) as output:
              output.write('publish=true\n')
          PY

      - name: Commit public market data
        if: steps.market.outputs.publish == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add public/data/etf-history.json

          if ! git diff --cached --quiet; then
            git commit -m 'Update Northstar delayed ETF quotes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        if: steps.market.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Upload website
        if: steps.market.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Publish website
        if: steps.market.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
