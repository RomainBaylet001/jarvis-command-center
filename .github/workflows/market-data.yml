
name: JARVIS - Update ETF Prices

on:
  workflow_dispatch:
  schedule:
    - cron: '15 19 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install market data reader
        run: python -m pip install 'yfinance>=0.2.60,<2'

      - name: Download and verify Xetra closing prices
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          import time
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          import yfinance as yf

          symbols = {
              "VWCE": "VWCE.DE",
              "VFEA": "VFEA.DE",
              "SXR8": "SXR8.DE",
          }

          now = datetime.now(timezone.utc)
          prices = {}
          latest_dates = {}

          for asset, symbol in symbols.items():
              rows = []
              last_error = None

              for attempt in range(1, 4):
                  try:
                      frame = yf.Ticker(symbol).history(
                          period="2y",
                          interval="1d",
                          auto_adjust=False,
                          actions=False,
                      )

                      if frame.empty or "Close" not in frame:
                          raise ValueError(
                              "Empty price history"
                          )

                      rows = []

                      for date, close in frame["Close"].items():
                          value = float(close)

                          if math.isfinite(value) and value > 0:
                              rows.append([
                                  date.date().isoformat(),
                                  round(value, 4)
                              ])

                      rows = sorted(
                          dict(
                              (date, price)
                              for date, price in rows
                          ).items()
                      )

                      if len(rows) < 60:
                          raise ValueError(
                              "Not enough historical prices"
                          )

                      latest = datetime.fromisoformat(
                          rows[-1][0]
                      ).date()

                      if latest < (
                          now.date() - timedelta(days=10)
                      ):
                          raise ValueError(
                              f"Stale market data: {latest}"
                          )

                      break

                  except Exception as exc:
                      last_error = exc
                      rows = []

                      print(
                          f"{asset} attempt {attempt}/3: {exc}",
                          flush=True
                      )

                      if attempt < 3:
                          time.sleep(attempt * 8)

              if not rows:
                  raise RuntimeError(
                      f"Market data unavailable for "
                      f"{asset} ({symbol}): {last_error}"
                  )

              prices[asset] = rows
              latest_dates[asset] = rows[-1][0]

              print(
                  f"{asset}: {len(rows)} prices; "
                  f"latest {rows[-1]}"
              )

          payload = {
              "source": (
                  "Yahoo Finance via yfinance; "
                  "Xetra EUR daily closing prices (delayed)"
              ),
              "currency": "EUR",
              "updatedAt": now.isoformat(
                  timespec="seconds"
              ),
              "latestDates": latest_dates,
              "symbols": symbols,
              "prices": prices,
          }

          output = Path(
              "public/data/etf-history.json"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output.write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8"
          )

          print(
              f"Created {output} with 3 ETF histories"
          )
          PY

      - name: Save public market data to GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/etf-history.json

          if ! git diff --cached --quiet; then
            git commit -m "Update JARVIS ETF daily close data"
            git push origin main
          else
            echo "No changes to ETF history"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload JARVIS site including market data
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Publish updated JARVIS site
        id: deployment
        uses: actions/deploy-pages@v4
